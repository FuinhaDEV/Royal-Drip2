<aside class="produto-info">
  <h1>{{ produto.titulo }}</h1>
  <p class="preco">R$ {{ "%.2f"|format(produto.preco) }}</p>

  <p class="preco-info">
    4 x de R$71,98 sem juros<br />
    <a href="#">Ver mais detalhes</a>
  </p>

  <div class="detalhes">
    <strong>Descrição:</strong><br />
    {{ produto.descricao }}
  </div>

  <div class="frete"><strong>Frete grátis</strong> a partir de R$297,00</div>

  <!-- Formulário Único de Adição ao Carrinho -->
  <form
    action="{{ url_for('adicionar_carrinho') }}"
    method="POST"
    class="tabela-tamanho"
  >
    <input type="hidden" name="produto_id" value="{{ produto.id }}" />

    <h3>TAMANHO</h3>
    <div class="tamanhos">
      {% for tamanho in produto.tamanhos %}
      <label class="tamanho">
        <input type="radio" name="tamanho" value="{{ tamanho }}" required />
        <span>{{ tamanho }}</span>
      </label>
      {% endfor %}
    </div>

    <a href="#" class="medidas-link">Tabela de medidas</a>

    <div class="acoes">
      <label
        for="quantidade"
        style="font-size: 0.9rem; margin-top: 12px; display: block"
      >
        QUANTIDADE
      </label>
      <input
        type="number"
        id="quantidade"
        name="quantidade"
        value="1"
        min="1"
        max="10"
        required
        style="
          width: 80px;
          padding: 10px;
          border: 1px solid #ccc;
          border-radius: 6px;
          margin-bottom: 15px;
        "
      />

      <button type="submit" class="comprar">ADICIONAR AO CARRINHO</button>
    </div>
  </form>
</aside>
