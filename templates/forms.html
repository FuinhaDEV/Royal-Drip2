<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Cliente - Loja de Roupas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script>
      function validarFormulario() {
        let nome = document.getElementById("nome").value;
        let telefone = document.getElementById("telefone").value;
        let email = document.getElementById("email").value;
        let cep = document.getElementById("cep").value;
        let senha = document.getElementById("senha").value;
        let confirmarSenha = document.getElementById("confirmarSenha").value;

        if (
          nome === "" ||
          telefone === "" ||
          email === "" ||
          cep === "" ||
          senha === "" ||
          confirmarSenha === ""
        ) {
          alert("Preencha todos os campos!");
          return false;
        }

        if (!email.includes("@")) {
          alert("E-mail inválido!");
          return false;
        }

        if (telefone.length < 10) {
          alert("Telefone inválido!");
          return false;
        }

        if (cep.length !== 8) {
          alert("CEP deve ter 8 números!");
          return false;
        }

        if (senha.length < 6) {
          alert("A senha deve ter pelo menos 6 caracteres!");
          return false;
        }

        if (senha !== confirmarSenha) {
          alert("As senhas não coincidem!");
          return false;
        }

        alert("Cadastro realizado com sucesso!");
        return true;
      }
    </script>
  </head>

  <body>
    <h2>Cadastro de Cliente - Loja de Roupas</h2>

    <form onsubmit="return validarFormulario();">
      <label>Nome:</label><br />
      <input type="text" id="nome" /><br /><br />

      <label>Telefone:</label><br />
      <input type="tel" id="telefone" placeholder="11999999999" /><br /><br />

      <label>E-mail:</label><br />
      <input type="email" id="email" /><br /><br />

      <label>CEP:</label><br />
      <input type="text" id="cep" placeholder="00000000" /><br /><br />

      <label>Senha:</label><br />
      <input type="password" id="senha" /><br /><br />

      <label>Confirmar Senha:</label><br />
      <input type="password" id="confirmarSenha" /><br /><br />

      <button type="submit">Cadastrar</button>
    </form>
  </body>
</html>
