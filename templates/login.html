<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Royal Drip</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>

  <body>
    <!-- Cabeçalho com Logo -->
    <header class="cabecalho">
      <div class="logo">
        <img
          class="brand-image"
          src="/static/imagens/Logo Marca/logo marca (1).png"
          alt="Royal Drip"
        />
      </div>
      <nav>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/registro">Registrar</a></li>
        </ul>
      </nav>
    </header>

    <!-- Formulário de Login -->
    <main class="registro-container">
      <div class="registro-card">
        <h1 class="registro-titulo">Entrar na Conta</h1>
        <p class="registro-subtitulo">Acesse sua conta para continuar comprando</p>

        {% if erros %}
          <div class="alertas">
            {% for erro in erros %}
              <div class="alerta alerta-erro">
                ⚠️ {{ erro }}
              </div>
            {% endfor %}
          </div>
        {% endif %}

        <form class="registro-form" method="POST">
          <div class="form-group">
            <label for="email">E-mail</label>
            <input 
              type="email" 
              id="email" 
              name="email"
              placeholder="seu@email.com.br"
              required
            />
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <input 
              type="password" 
              id="senha" 
              name="senha"
              placeholder="Sua senha"
              required
            />
          </div>

          <button type="submit" class="btn-cadastrar">Entrar</button>
        </form>

        <p class="login-link">
          Não possui uma conta? <a href="/registro">Cadastre-se aqui</a>
        </p>
      </div>
    </main>

    <!-- Rodapé -->
    <footer class="footer">
      <p>&copy; 2026 Royal Drip. Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
